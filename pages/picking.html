<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préparation Picking - SoufStock Enterprise ERP/WMS</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#020617',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            400: '#94a3b8',
                            300: '#cbd5e1',
                            100: '#f1f5f9'
                        },
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                            400: '#34d399',
                            300: '#6ee7b7'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        body { background-color: #020617; color: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col h-screen p-4 select-none shrink-0">
        <div class="flex items-center gap-3 px-2 mb-6">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-500">
                <i class="fas fa-snowflake text-lg"></i>
            </div>
            <div>
                <span class="font-bold text-base tracking-wide block text-slate-100">SoufStock</span>
                <span class="text-[10px] text-slate-400 tracking-wider uppercase block">Gestion</span>
            </div>
        </div>
        
        <nav id="sidebarNav" class="flex-1 overflow-y-auto pr-1">
            <!-- Dynamic Sidebar -->
        </nav>

        <div class="pt-4 mt-auto border-t border-slate-800/80">
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 mb-2">
                <span id="sidebarUserName" class="block text-xs font-bold text-slate-200 truncate uppercase">YAHYA SOUFIANE</span>
                <span class="block text-[10px] text-emerald-400 font-medium mt-0.5">Administrateur</span>
            </div>
            <button id="logoutBtn" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-xl py-2 px-3 text-xs font-semibold transition flex items-center justify-center gap-2">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </button>
        </div>
    </aside>

    <!-- MAIN CONTAINER -->
    <div class="flex-1 flex flex-col h-screen min-w-0 overflow-hidden">
        
        <!-- HEADER -->
        <header class="h-20 bg-slate-900/40 border-b border-slate-800/80 px-8 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4">
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-100">Préparation Picking</h1>
                    <div class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                        <span>Accueil</span>
                        <span>/</span>
                        <strong class="text-slate-300">Préparation Picking</strong>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-4 bg-slate-900/80 border border-slate-800 px-4 py-2 rounded-xl">
                <div class="text-right">
                    <span id="currentDate" class="text-xs font-medium text-slate-300 block">Mardi 28 juillet 2026</span>
                    <span id="currentTime" class="text-[10px] text-emerald-400 font-mono block">18:05:23</span>
                </div>
            </div>
        </header>

        <!-- PAGE BODY -->
        <main class="flex-1 p-8 overflow-y-auto">
            <div class="max-w-7xl mx-auto flex flex-col gap-6">
                
                <!-- SCANNER / SAISIE DOCUMENT DE VENTE -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        <i class="fas fa-barcode text-emerald-400 mr-1.5"></i> Scanner ou Saisir le Document de Vente
                    </label>
                    <div class="flex items-center gap-3">
                        <input type="text" id="docVenteInput" placeholder="Ex: BL-2026-00123 (Appuyez sur Entrée)" 
                            class="bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 w-full max-w-md transition shadow-inner font-mono">
                        <button id="searchDocBtn" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-6 py-3 rounded-xl text-xs transition flex items-center gap-2 shadow-lg cursor-pointer">
                            <i class="fas fa-search"></i> Charger le Bon
                        </button>
                    </div>
                </div>

                <!-- TABLE CONTAINER -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-950/60 text-slate-400 uppercase text-[11px] tracking-wider border-b border-slate-800 font-semibold">
                                    <th class="p-4">Document / Ligne</th>
                                    <th class="p-4">Article & Désignation</th>
                                    <th class="p-4">Client</th>
                                    <th class="p-4 text-center">Quantité Commandée</th>
                                    <th class="p-4 text-center">Quantité Préparée</th>
                                    <th class="p-4 text-center">Statut</th>
                                </tr>
                            </thead>
                            <tbody id="pickingTableBody" class="divide-y divide-slate-800/50">
                                <tr>
                                    <td colspan="6" class="p-10 text-center text-slate-400 text-xs">
                                        <i class="fas fa-info-circle mr-2 text-emerald-500 text-base"></i> Veuillez saisir ou scanner un document de vente pour afficher les lignes.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import Navigation from './assets/js/core/navigation.js';
        import supabase from './assets/js/core/supabase.js';

        document.addEventListener("DOMContentLoaded", async () => {
            await Navigation.init();

            const docVenteInput = document.getElementById("docVenteInput");
            const searchDocBtn = document.getElementById("searchDocBtn");

            if (docVenteInput) {
                docVenteInput.focus();
                docVenteInput.addEventListener("keydown", async (e) => {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        await fetchCommandesByDocument(docVenteInput.value.trim());
                    }
                });
            }

            if (searchDocBtn) {
                searchDocBtn.addEventListener("click", async () => {
                    const docVal = docVenteInput ? docVenteInput.value.trim() : "";
                    await fetchCommandesByDocument(docVal);
                });
            }

            const logoutBtn = document.getElementById("logoutBtn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", async () => {
                    await supabase.auth.signOut();
                    window.location.href = "login.html";
                });
            }
        });

        async function fetchCommandesByDocument(docVente) {
            const tbody = document.getElementById("pickingTableBody");
            if (!docVente) {
                alert("Veuillez saisir ou scanner un document de vente !");
                return;
            }

            tbody.innerHTML = `<tr><td colspan="6" class="p-10 text-center text-slate-400 text-xs">
                <i class="fas fa-spinner fa-spin mr-2 text-emerald-500 text-base"></i> Recherche du document ${docVente}...
            </td></tr>`;

            try {
                const { data, error } = await supabase
                    .from('commandes_excel')
                    .select('*')
                    .eq('document_vente', docVente)
                    .order('ligne_commande', { ascending: true });

                if (error) {
                    console.error("Erreur Supabase:", error);
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400 text-xs">Erreur lors de la récupération des données.</td></tr>`;
                    return;
                }

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-amber-400 text-xs"><i class="fas fa-exclamation-circle mr-2"></i> Aucun article trouvé pour le document : <strong>${docVente}</strong></td></tr>`;
                    return;
                }

                let html = "";
                data.forEach((item) => {
                    const qteCmd = Number(item.quantite_commandee || 0);
                    const qtePrep = Number(item.quantite_preparee || 0);
                    
                    html += `
                        <tr class="hover:bg-slate-800/35 transition" data-id="${item.id}">
                            <td class="p-4 font-semibold text-emerald-400 text-xs">
                                ${item.document_vente} <span class="text-slate-500 font-normal">#${item.ligne_commande}</span>
                            </td>
                            <td class="p-4 text-slate-200 font-medium text-xs">
                                <div class="text-slate-100">${item.designation_article}</div>
                                <div class="text-[10px] text-slate-400 font-mono">Art: ${item.article} | Magasin: ${item.magasin_source || '-'}</div>
                            </td>
                            <td class="p-4 text-slate-300 font-medium text-xs">${item.client || '-'}</td>
                            <td class="p-4 text-center text-emerald-300 font-mono font-bold text-xs">${qteCmd.toLocaleString()} ${item.unite || 'KG'}</td>
                            <td class="p-4 text-center">
                                <input type="number" value="${qtePrep}" class="qte-prep-input bg-slate-950 border border-slate-800 rounded-lg w-24 text-center py-1.5 text-xs text-emerald-400 font-mono focus:outline-none focus:border-emerald-500 shadow-inner" data-id="${item.id}">
                            </td>
                            <td class="p-4 text-center">
                                <span class="px-3 py-1 rounded-full text-[10px] font-semibold bg-slate-950 text-slate-300 border border-slate-800">
                                    ${item.statut || 'IMPORTEE'}
                                </span>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

            } catch (err) {
                console.error("Erreur technique:", err);
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400 text-xs">Erreur de connexion au serveur.</td></tr>`;
            }
        }
    </script>
</body>
</html>
