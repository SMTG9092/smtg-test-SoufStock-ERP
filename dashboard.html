<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock Enterprise ERP - Commandes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0b131b;
            --sidebar-bg: #070d13;
            --card-bg: rgba(17, 24, 39, 0.85);
            --card-border: rgba(16, 185, 129, 0.2);
            --card-border-hover: rgba(16, 185, 129, 0.5);
            --primary-glow: #10b981;
            --danger-glow: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
        }

        .app {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* --- Sidebar Pro Styling --- */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-logo {
            font-size: 24px;
            color: var(--primary-glow);
        }

        .sidebar-brand h2 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .sidebar-brand span {
            font-size: 11px;
            color: var(--text-muted);
        }

        .sidebar-nav {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            flex: 1;
        }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.2);
        }

        .sidebar-user-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin-bottom: 10px;
        }

        .sidebar-user-box h4 {
            font-size: 13px;
            color: #fff;
            margin-bottom: 2px;
        }

        .sidebar-user-box span {
            font-size: 11px;
            color: var(--primary-glow);
            font-weight: 600;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: var(--danger-glow);
            color: #fff;
            border-color: var(--danger-glow);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        /* --- Main Content Area --- */
        .main {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.04), transparent 40%);
        }

        .page-header {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(59, 130, 246, 0.06) 100%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
        }

        .page-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .pro-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(12px);
            margin-bottom: 25px;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-input {
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            border: 1px solid var(--card-border);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            outline: none;
            flex: 1;
            min-width: 200px;
        }
        .filter-input:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .table-pro {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table-pro th {
            text-align: left;
            color: var(--text-muted);
            padding: 12px 10px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .table-pro td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #e2e8f0;
        }

        .table-pro tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge-statut {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
        }
        .badge-statut.en-cours { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .badge-statut.valide { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .badge-statut.annule { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    </style>
</head>
<body>

<div class="app">

    <!-- SIDEBAR PRO -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-snowflake sidebar-logo"></i>
            <div class="sidebar-brand">
                <h2>SoufStock</h2>
                <span>Gestion</span>
            </div>
        </div>

        <nav class="sidebar-nav" id="sidebarNav">
            <!-- Ghadi t-3mmar otomatikan mn Navigation.js -->
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user-box">
                <h4 id="userNameSidebar">Chargement...</h4>
                <span id="userRoleSidebar" style="display: none;"></span>
            </div>
            <button id="btnLogout" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
        
        <div class="page-header">
            <div>
                <h1>Gestion des Commandes (KG)</h1>
                <p>Suivi en direct des commandes issues de la vue v_commandes_kg.</p>
            </div>
            <div style="text-align: right; font-size: 12px; color: var(--text-muted);">
                <i class="fas fa-calendar-alt"></i> <span id="currentDateBanner">--</span>
            </div>
        </div>

        <!-- CARD & TABLE -->
        <div class="pro-card">
            <div class="filter-bar">
                <input type="text" id="searchClient" class="filter-input" placeholder="Rechercher par client ou doc vente...">
                <input type="date" id="filterDate" class="filter-input" style="max-width: 200px;">
            </div>

            <div style="overflow-x: auto;">
                <table class="table-pro">
                    <thead>
                        <tr>
                            <th>Doc Vente</th>
                            <th>Client</th>
                            <th>Réceptionnaire</th>
                            <th>Article</th>
                            <th>Désignation</th>
                            <th>Qté Commandée</th>
                            <th>Qté Préparée</th>
                            <th>Qté Expédiée</th>
                            <th>Date Livraison</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody id="commandesTableBody">
                        <tr>
                            <td colspan="10" style="text-align: center; color: var(--text-muted);">Chargement des commandes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<!-- Logique Script -->
<script type="module">
    import Navigation from "/assets/js/core/navigation.js";
    import SessionManager from "/assets/js/core/session.js";
    import supabase from "/assets/js/core/supabase.js";
    import { initPermissions } from "/assets/js/core/permissions.js";

    let allCommandesData = [];

    document.addEventListener("DOMContentLoaded", async () => {
        // Date active
        const now = new Date();
        document.getElementById('currentDateBanner').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        const isAuth = await SessionManager.requireAuth();
        if (!isAuth) return;

        await initPermissions();
        Navigation.init();

        const user = await SessionManager.getUser();
        if (user) {
            document.getElementById('userNameSidebar').textContent = user.email || "Utilisateur";
        }

        await loadCommandesData();

        // Filtres events
        document.getElementById('searchClient').addEventListener('input', filterTable);
        document.getElementById('filterDate').addEventListener('change', filterTable);

        const btnLogout = document.getElementById('btnLogout');
        if (btnLogout) {
            btnLogout.addEventListener('click', async () => {
                if (confirm("Voulez-vous vraiment vous déconnecter ?")) {
                    await SessionManager.logout();
                }
            });
        }
    });

    async function loadCommandesData() {
        try {
            // Jbed data mn la vue v_commandes_kg dyal Supabase
            const { data, error } = await supabase
                .from('v_commandes_kg')
                .select('*')
                .order('date_livraison', { ascending: true });

            if (error) {
                console.error("Erreur fetch v_commandes_kg:", error);
                document.getElementById('commandesTableBody').innerHTML = `<tr><td colspan="10" style="text-align: center; color: var(--danger-glow);">Erreur de chargement des commandes.</td></tr>`;
                return;
            }

            allCommandesData = data || [];
            renderCommandesTable(allCommandesData);

        } catch (err) {
            console.error("Erreur inattendue:", err);
        }
    }

    function renderCommandesTable(dataList) {
        const tbody = document.getElementById('commandesTableBody');
        if (!tbody) return;

        if (dataList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: var(--text-muted);">Aucune commande trouvée.</td></tr>`;
            return;
        }

        let html = '';
        dataList.forEach(item => {
            html += `
                <tr>
                    <td><strong>${item.document_vente || ''}</strong></td>
                    <td>${item.client || ''}</td>
                    <td>${item.nom_receptionnaire || ''}</td>
                    <td>${item.article || ''}</td>
                    <td>${item.designation_article || ''}</td>
                    <td>${item.quantite_commandee ? Number(item.quantite_commandee).toLocaleString('fr-FR', {minimumFractionDigits: 3}) : '0'}</td>
                    <td>${item.quantite_preparee ? Number(item.quantite_preparee).toLocaleString('fr-FR', {minimumFractionDigits: 3}) : '0'}</td>
                    <td>${item.quantite_expediee ? Number(item.quantite_expediee).toLocaleString('fr-FR', {minimumFractionDigits: 3}) : '0'}</td>
                    <td>${item.date_livraison || ''}</td>
                    <td><span class="badge-statut en-cours">${item.statut || 'En cours'}</span></td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function filterTable() {
        const searchText = document.getElementById('searchClient').value.toLowerCase();
        const searchDate = document.getElementById('filterDate').value;

        const filtered = allCommandesData.filter(item => {
            const matchText = (item.client && item.client.toLowerCase().includes(searchText)) ||
                              (item.document_vente && item.document_vente.toLowerCase().includes(searchText));
            
            const matchDate = searchDate ? item.date_livraison === searchDate : true;

            return matchText && matchDate;
        });

        renderCommandesTable(filtered);
    }
</script>

</body>
</html>
