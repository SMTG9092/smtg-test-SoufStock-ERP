<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock ERP - Gestion Avancée des Rôles & Permissions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .custom-card {
            background-color: #1f2937;
            border: 1px solid #374151;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

    <!-- Header -->
    <header class="flex justify-between items-center bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-md mb-6">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-gray-100">
                <i class="fa-solid fa-shield-halved mr-2 text-indigo-400"></i> SoufStock ERP - Gestion des Rôles & Permissions
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition">
                <i class="fa-solid fa-house mr-1"></i> Dashboard
            </a>
            <span class="font-semibold text-gray-300 text-sm bg-gray-900 px-3 py-1.5 rounded border border-gray-700">
                <i class="fa-solid fa-user mr-1 text-indigo-400"></i> <span id="user-name">Chargement...</span>
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full space-y-6">
        
        <!-- Notification Message -->
        <div id="alert-box" class="hidden p-4 rounded-lg text-sm font-semibold"></div>

        <!-- Layout Grid: 1. Gestion des Rôles | 2. Matrice des Permissions -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Section 1: Liste des Rôles -->
            <div class="custom-card p-5 rounded-lg shadow lg:col-span-1 space-y-4">
                <h2 class="text-base font-bold text-indigo-300 border-b border-gray-700 pb-3">
                    <i class="fa-solid fa-user-tag mr-1"></i> Rôles Disponibles
                </h2>
                <div id="roles-list" class="space-y-2">
                    <p class="text-xs text-gray-500">Chargement des rôles...</p>
                </div>
            </div>

            <!-- Section 2: Matrice / Permissions dyal Rôle M-khtar -->
            <div class="custom-card p-5 rounded-lg shadow lg:col-span-3 space-y-4">
                <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                    <h2 class="text-base font-bold text-indigo-300">
                        <i class="fa-solid fa-key mr-1"></i> Permissions pour le rôle: <span id="selected-role-title" class="text-white font-mono">-</span>
                    </h2>
                    <button id="btn-save-permissions" onclick="window.saveRolePermissions()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded text-xs font-semibold transition shadow flex items-center gap-1 hidden">
                        <i class="fa-solid fa-floppy-disk"></i> Enregistrer les modifications
                    </button>
                </div>

                <div id="permissions-container" class="overflow-x-auto">
                    <p class="text-xs text-gray-500 p-4 text-center">Veuillez sélectionner un rôle à gauche pour afficher ses permissions.</p>
                </div>
            </div>

        </div>

    </main>

    <!-- Script JavaScript -->
    <script type="module">
        import supabase, { getUser } from "./assets/js/core/supabase.js";

        const userNameSpan = document.getElementById("user-name");
        const rolesListContainer = document.getElementById("roles-list");
        const permissionsContainer = document.getElementById("permissions-container");
        const selectedRoleTitle = document.getElementById("selected-role-title");
        const btnSavePermissions = document.getElementById("btn-save-permissions");
        const alertBox = document.getElementById("alert-box");

        let currentRoleId = null;
        let allRoles = [];
        let allPermissions = [];
        let currentRolePermissions = new Set();

        document.addEventListener("DOMContentLoaded", async () => {
            const user = await getUser();
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            await loadUserProfileName(user);
            await checkAdminAccess(user.id);
            await loadRolesAndPermissions();
        });

        async function loadUserProfileName(user) {
            try {
                const { data } = await supabase.from("profiles").select("full_name, prenom").eq("id", user.id).single();
                if (data) {
                    userNameSpan.textContent = data.full_name || data.prenom || user.email.split('@')[0];
                } else {
                    userNameSpan.textContent = user.email.split('@')[0];
                }
            } catch {
                userNameSpan.textContent = "Admin";
            }
        }

        async function checkAdminAccess(userId) {
            try {
                const { data } = await supabase.from("profiles").select("role").eq("id", userId).single();
                if (!data || data.role !== 'admin') {
                    alert("Accès réservé aux administrateurs !");
                    window.location.href = "dashboard.html";
                }
            } catch {
                window.location.href = "dashboard.html";
            }
        }

        async function loadRolesAndPermissions() {
            try {
                // 1. Jib Roles
                const { data: rolesData, error: rolesError } = await supabase
                    .from("roles")
                    .select("*")
                    .order("ordre_affichage", { ascending: true });

                if (rolesError) throw rolesError;
                allRoles = rolesData || [];

                // 2. Jib Permissions
                const { data: permData, error: permError } = await supabase
                    .from("permissions")
                    .select("*")
                    .eq("actif", true)
                    .order("module", { ascending: true });

                if (permError) throw permError;
                allPermissions = permData || [];

                renderRolesList();

                if (allRoles.length > 0) {
                    selectRole(allRoles[0].id, allRoles[0].nom);
                }

            } catch (err) {
                console.error("Erreur chargement:", err.message);
                rolesListContainer.innerHTML = `<p class="text-xs text-red-400">Erreur de chargement: ${err.message}</p>`;
            }
        }

        function renderRolesList() {
            if (allRoles.length === 0) {
                rolesListContainer.innerHTML = `<p class="text-xs text-gray-500">Aucun rôle trouvé dans la table roles.</p>`;
                return;
            }

            rolesListContainer.innerHTML = allRoles.map(r => `
                <button onclick="window.selectRole(${r.id}, '${r.nom}')" id="role-btn-${r.id}" class="w-full text-left px-3 py-2.5 rounded text-xs font-semibold transition bg-gray-900 border border-gray-700 hover:border-indigo-500 flex justify-between items-center">
                    <span><i class="fa-solid fa-shield mr-2" style="color: ${r.couleur || '#6366f1'}"></i> ${r.nom}</span>
                    <span class="text-[10px] text-gray-400 font-mono">${r.code}</span>
                </button>
            `).join('');
        }

        window.selectRole = async function(roleId, roleName) {
            currentRoleId = roleId;
            selectedRoleTitle.textContent = roleName;
            btnSavePermissions.classList.remove("hidden");

            // Highlight selected button
            document.querySelectorAll('#roles-list button').forEach(btn => {
                btn.classList.remove('border-indigo-500', 'bg-gray-800');
            });
            const activeBtn = document.getElementById(`role-btn-${roleId}`);
            if (activeBtn) activeBtn.classList.add('border-indigo-500', 'bg-gray-800');

            // Jib role_permissions dyal had role
            try {
                const { data, error } = await supabase
                    .from("role_permissions")
                    .select("permission_id, autorise")
                    .eq("role_id", roleId);

                if (error) throw error;

                currentRolePermissions.clear();
                (data || []).forEach(rp => {
                    if (rp.autorise) {
                        currentRolePermissions.add(rp.permission_id);
                    }
                });

                renderPermissionsMatrix();
            } catch (err) {
                console.error("Erreur fetch role permissions:", err.message);
            }
        };

        function renderPermissionsMatrix() {
            if (allPermissions.length === 0) {
                permissionsContainer.innerHTML = `<p class="text-xs text-gray-500">Aucune permission enregistrée.</p>`;
                return;
            }

            // Grouper b module
            const groupedByModule = allPermissions.reduce((acc, p) => {
                if (!acc[p.module]) acc[p.module] = [];
                acc[p.module].push(p);
                return acc;
            }, {});

            let html = `<div class="space-y-4">`;

            for (const [moduleName, perms] of Object.entries(groupedByModule)) {
                html += `
                    <div class="bg-gray-900 border border-gray-700 rounded-lg p-3">
                        <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-2 pb-1 border-b border-gray-800">
                            Module: ${moduleName}
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                `;

                perms.forEach(p => {
                    const isChecked = currentRolePermissions.has(p.id);
                    html += `
                        <label class="flex items-center gap-2 p-2 rounded hover:bg-gray-800 cursor-pointer transition text-xs border border-gray-800">
                            <input type="checkbox" value="${p.id}" ${isChecked ? 'checked' : ''} class="perm-checkbox w-4 h-4 accent-indigo-600 rounded">
                            <div>
                                <span class="font-semibold text-white block">${p.action}</span>
                                <span class="text-[10px] text-gray-400">${p.description || p.code}</span>
                            </div>
                        </label>
                    `;
                });

                html += `</div></div>`;
            }

            html += `</div>`;
            permissionsContainer.innerHTML = html;
        }

        window.saveRolePermissions = async function() {
            if (!currentRoleId) return;

            const checkboxes = document.querySelectorAll('.perm-checkbox');
            const selectedPermissionIds = Array.from(checkboxes)
                .filter(cb => cb.checked)
                .map(cb => parseInt(cb.value));

            try {
                // 1. Supprimer l-9dim kaml wla upsert
                // Ṭriqa sahla: N-supprimiw role_permissions dyal had role w n-sajjlou jdad
                const { error: deleteError } = await supabase
                    .from("role_permissions")
                    .delete()
                    .eq("role_id", currentRoleId);

                if (deleteError) throw deleteError;

                if (selectedPermissionIds.length > 0) {
                    const insertPayload = selectedPermissionIds.map(permId => ({
                        role_id: currentRoleId,
                        permission_id: permId,
                        autorise: true
                    }));

                    const { error: insertError } = await supabase
                        .from("role_permissions")
                        .insert(insertPayload);

                    if (insertError) throw insertError;
                }

                showNotification("Permissions enregistrées avec succès !", "success");
            } catch (err) {
                console.error("Erreur sauvegarde permissions:", err.message);
                showNotification(`Erreur: ${err.message}`, "error");
            }
        };

        function showNotification(message, type) {
            alertBox.textContent = message;
            alertBox.className = `p-4 rounded-lg text-sm font-semibold ${type === 'success' ? 'bg-emerald-900 text-emerald-200 border border-emerald-700' : 'bg-red-900 text-red-200 border border-red-700'}`;
            alertBox.classList.remove("hidden");
            setTimeout(() => {
                alertBox.classList.add("hidden");
            }, 3000);
        }
    </script>
</body>
</html>
