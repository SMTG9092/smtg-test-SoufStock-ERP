<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock ERP - Accès Non Autorisé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-6 font-sans">

    <!-- Modal / Alerte dyal Ɛadam S-Ṣalaḥiyya -->
    <div id="access-denied-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center">
        <div class="bg-gray-800 border border-red-600 p-8 rounded-xl shadow-2xl text-center max-w-md w-full mx-4 space-y-4">
            <div class="text-red-500 text-5xl animate-bounce">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h2 class="text-xl font-bold text-white">Accès Non Autorisé (444)</h2>
            <p class="text-gray-300 text-sm">
                Désolé, vous n'avez pas les privilèges nécessaires pour accéder à cette page ou consulter cette ressource.
            </p>
            <div class="text-indigo-400 text-xs font-semibold">
                Redirection automatique vers le Dashboard dans <span id="countdown-timer" class="text-white font-bold text-sm">3</span> secondes...
            </div>
            <div>
                <a href="dashboard.html" class="inline-block bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded text-xs font-semibold transition">
                    Retourner au Dashboard
                </a>
            </div>
        </div>
    </div>

    <!-- Script JavaScript dyal Redirection w t-taḥaqquq -->
    <script type="module">
        import { getUser } from "./assets/js/core/supabase.js";

        document.addEventListener("DOMContentLoaded", async () => {
            const user = await getUser();
            
            // Ila kan l-user ga3 ma m-loji, ddiih l index.html
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            // BDDAW D-COUNTER D 3 D S-TAWA W REDIRECTION
            let timeLeft = 3;
            const countdownTimer = document.getElementById("countdown-timer");

            const timerInterval = setInterval(() => {
                timeLeft--;
                countdownTimer.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    window.location.href = "dashboard.html";
                }
            }, 1000);
        });
    </script>
</body>
</html>
