<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock ERP - Page Modèle</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS ḍasI (Custom CSS) ila bghiti t-zidchi styling khas */
        .custom-card {
            background-color: #1f2937;
            border: 1px solid #374151;
            transition: all 0.3s ease;
        }
        .custom-card:hover {
            border-color: #6366f1;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

    <!-- Header -->
    <header class="flex justify-between items-center bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-md mb-6">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-gray-100">
                <i class="fa-solid fa-boxes-stacked mr-2 text-indigo-400"></i> SoufStock ERP
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition">
                <i class="fa-solid fa-house mr-1"></i> Dashboard
            </a>
            <span class="font-semibold text-gray-300 text-sm bg-gray-900 px-3 py-1.5 rounded border border-gray-700">
                <i class="fa-solid fa-user mr-1 text-indigo-400"></i> <span id="user-email">Administrateur</span>
            </span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Card 1 -->
        <div class="custom-card p-5 rounded-lg shadow">
            <h2 class="text-base font-bold text-indigo-300 mb-2">
                <i class="fa-solid fa-rocket mr-1"></i> Section 1
            </h2>
            <p class="text-sm text-gray-400 mb-4">Wsafet dyal l-mokawwanaw wla l-khadma hna.</p>
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-xs font-bold transition shadow">
                Action
            </button>
        </div>

        <!-- Card 2 -->
        <div class="custom-card p-5 rounded-lg shadow">
            <h2 class="text-base font-bold text-indigo-300 mb-2">
                <i class="fa-solid fa-list mr-1"></i> Section 2
            </h2>
            <p class="text-sm text-gray-400 mb-4">Wsafet dyal l-mokawwanaw wla l-khadma hna.</p>
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-xs font-bold transition shadow">
                Action
            </button>
        </div>

        <!-- Card 3 -->
        <div class="custom-card p-5 rounded-lg shadow">
            <h2 class="text-base font-bold text-indigo-300 mb-2">
                <i class="fa-solid fa-chart-line mr-1"></i> Section 3
            </h2>
            <p class="text-sm text-gray-400 mb-4">Wsafet dyal l-mokawwanaw wla l-khadma hna.</p>
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-xs font-bold transition shadow">
                Action
            </button>
        </div>

    </main>

    <!-- Script JavaScript (Optional) -->
    <script type="module">
        // Kod JS ila kan darori
        console.log("Page chargée avec succès !");
    </script>
</body>
</html>
