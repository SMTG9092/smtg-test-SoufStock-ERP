<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs - SoufStock ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">

    <!-- Header -->
    <header class="flex justify-between items-center bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-md mb-6">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-gray-100"><i class="fa-solid fa-users mr-2 text-indigo-400"></i> Gestion des Utilisateurs</h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition">
                <i class="fa-solid fa-house mr-1"></i> Dashboard
            </a>
            <span class="font-semibold text-gray-300 text-sm bg-gray-900 px-3 py-1.5 rounded border border-gray-700">
                <i class="fa-solid fa-user mr-1 text-indigo-400"></i> <span id="user-email">...</span>
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Formulaire Ajout / Modification Utilisateur -->
        <div class="bg-gray-800 p-5 rounded-lg shadow border border-gray-700 h-fit">
            <h2 id="form-title" class="text-base font-bold text-indigo-300 mb-4 pb-2 border-b border-gray-700">
                <i class="fa-solid fa-user-plus mr-1"></i> Ajouter un Utilisateur
            </h2>
            
            <form id="user-form" class="space-y-4">
                <input type="hidden" id="user-id">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Nom Complet</label>
                    <input type="text" id="nom-complet" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Email</label>
                    <input type="email5" id="email" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Rôle / Profil</label>
                    <select id="role" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <option value="Preparateur">Préparateur</option>
                        <option value="Controleur">Contrôleur</option>
                        <option value="Magasinier">Magasinier</option>
                        <option value="Administrateur">Administrateur</option>
                    </select>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="btn-save" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded text-sm transition shadow">
                        Enregistrer
                    </button>
                    <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden bg-gray-700 hover:bg-gray-600 text-gray-300 px-4 py-2 rounded text-sm font-semibold transition">
                        Annuler
                    </button>
                </div>
            </form>
        </div>

        <!-- Tableau Liste des Utilisateurs -->
        <div class="lg:col-span-2 bg-gray-800 p-5 rounded-lg shadow border border-gray-700 overflow-hidden">
            <h2 class="text-base font-bold text-indigo-300 mb-4 pb-2 border-b border-gray-700">
                <i class="fa-solid fa-list mr-1"></i> Liste des Profils Utilisateurs
            </h2>

            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse">
                    <thead class="bg-gray-900 text-gray-400 uppercase text-xs text-left border-b border-gray-700">
                        <tr>
                            <th class="p-3">Nom Complet</th>
                            <th class="p-3">Email</th>
                            <th class="p-3">Rôle</th>
                            <th class="p-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="text-gray-300">
                        <tr>
                            <td colspan="4" class="p-6 text-center text-gray-500">
                                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Chargement des utilisateurs...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Script Logique -->
    <script type="module">
        import supabase, { getUser } from "./assets/js/core/supabase.js";

        const emailSpan = document.getElementById("user-email");
        const userForm = document.getElementById("user-form");
        const tbody = document.getElementById("users-table-body");
        const formTitle = document.getElementById("form-title");
        const btnCancel = document.getElementById("btn-cancel");
        const userIdInput = document.getElementById("user-id");
        const nomCompletInput = document.getElementById("nom-complet");
        const emailInput = document.getElementById("email");
        const roleSelect = document.getElementById("role");

        document.addEventListener("DOMContentLoaded", async () => {
            const user = await getUser();
            emailSpan.textContent = user?.email || "Admin";
            loadUsers();
        });

        async function loadUsers() {
            const { data, error } = await supabase.from("user_profiles").select("*").order("nom_complet", { ascending: true });

            if (error) {
                console.error("Erreur chargement users:", error);
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-400">Erreur lors du chargement des données.</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">Aucun utilisateur trouvé.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(u => `
                <tr class="border-b border-gray-700 hover:bg-gray-750">
                    <td class="p-3 font-semibold text-white">${u.nom_complet || '-'}</td>
                    <td class="p-3 text-gray-300">${u.email || '-'}</td>
                    <td class="p-3">
                        <span class="px-2 py-1 rounded text-xs font-bold bg-indigo-900 text-indigo-300">
                            ${u.role || 'Preparateur'}
                        </span>
                    </td>
                    <td class="p-3 text-center space-x-2">
                        <button onclick="window.editUser('${u.id}', '${u.nom_complet || ''}', '${u.email || ''}', '${u.role || ''}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded text-xs transition">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="window.deleteUser('${u.id}')" class="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1 rounded text-xs transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        userForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = userIdInput.value;
            const nom_complet = nomCompletInput.value;
            const email = emailInput.value;
            const role = roleSelect.value;

            const payload = { nom_complet, email, role };

            if (id) {
                // Modification
                const { error } = await supabase.from("user_profiles").update(payload).eq("id", id);
                if (error) {
                    alert("Erreur modification: " + error.message);
                } else {
                    resetForm();
                    loadUsers();
                }
            } else {
                // Insertion
                const { error } = await supabase.from("user_profiles").insert([payload]);
                if (error) {
                    alert("Erreur ajout: " + error.message);
                } else {
                    resetForm();
                    loadUsers();
                }
            }
        });

        window.editUser = function(id, nom, email, role) {
            userIdInput.value = id;
            nomCompletInput.value = nom;
            emailInput.value = email;
            roleSelect.value = role || 'Preparateur';
            
            formTitle.innerHTML = `<i class="fa-solid fa-user-pen mr-1"></i> Modifier l'Utilisateur`;
            document.getElementById("btn-save").textContent = "Mettre à jour";
            btnCancel.classList.remove("hidden");
        }

        window.deleteUser = async function(id) {
            if (!confirm("Voulez-vous vraiment supprimer cet utilisateur ?")) return;

            const { error } = await supabase.from("user_profiles").delete().eq("id", id);
            if (error) {
                alert("Erreur suppression: " + error.message);
            } else {
                loadUsers();
            }
        }

        window.resetForm = function() {
            userForm.reset();
            userIdInput.value = "";
            formTitle.innerHTML = `<i class="fa-solid fa-user-plus mr-1"></i> Ajouter un Utilisateur`;
            document.getElementById("btn-save").textContent = "Enregistrer";
            btnCancel.classList.add("hidden");
        }
    </script>
</body>
</html>
