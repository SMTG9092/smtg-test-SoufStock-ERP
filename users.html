<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock ERP - Gestion des Utilisateurs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .custom-card {
            background-color: #1f2937;
            border: 1px solid #374151;
            transition: all 0.3s ease;
        }
        .custom-card:hover {
            border-color: #6366f1;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

    <!-- Header -->
    <header class="flex justify-between items-center bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-md mb-6">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-gray-100">
                <i class="fa-solid fa-users mr-2 text-indigo-400"></i> SoufStock ERP - Gestion des Utilisateurs
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition">
                <i class="fa-solid fa-house mr-1"></i> Dashboard
            </a>
            <span class="font-semibold text-gray-300 text-sm bg-gray-900 px-3 py-1.5 rounded border border-gray-700">
                <i class="fa-solid fa-user mr-1 text-indigo-400"></i> <span id="user-email">Chargement...</span>
            </span>
        </div>
    </header>

    <!-- Main Content Container (2 Jihat: Auth.users / User_profiles) -->
    <main class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- JIHAT 1: Table auth.users (Authentification) -->
        <div class="custom-card p-5 rounded-lg shadow">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-700">
                <h2 class="text-base font-bold text-emerald-300">
                    <i class="fa-solid fa-shield-halved mr-1"></i> Comptes Auth (auth.users)
                </h2>
                <!-- Bouton Ajouter f auth.users -->
                <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-bold transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-user-plus"></i> Ajouter Auth
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse text-left">
                    <thead class="bg-gray-900 text-gray-400 uppercase text-xs border-b border-gray-700">
                        <tr>
                            <th class="p-3">Email / UID</th>
                            <th class="p-3">Provider</th>
                            <th class="p-3">Créé le</th>
                        </tr>
                    </thead>
                    <tbody id="auth-users-table-body" class="text-gray-300">
                        <tr>
                            <td colspan="3" class="p-6 text-center text-gray-500">
                                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Chargement...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- JIHAT 2: Table user_profiles (Profils & Modification) -->
        <div class="custom-card p-5 rounded-lg shadow">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-700">
                <h2 class="text-base font-bold text-indigo-300">
                    <i class="fa-solid id-card mr-1"></i> Profils & Métiers (user_profiles)
                </h2>
            </div>

            <form id="user-profile-form" class="space-y-3 mb-4 bg-gray-900/50 p-3 rounded border border-gray-700/50">
                <input type="hidden" id="profile-id">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Nom Complet</label>
                        <input type="text" id="nom-complet" required class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Matricule</label>
                        <input type="text" id="matricule" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Service</label>
                        <input type="text" id="service" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Poste</label>
                        <input type="text" id="poste" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Role ID</label>
                        <input type="number" id="role-id" value="1" required class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="flex gap-2 pt-1">
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 rounded text-xs transition shadow">
                        Mettre à jour le profil
                    </button>
                    <button type="button" onclick="resetForm()" class="bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-1.5 rounded text-xs transition">
                        Annuler
                    </button>
                </div>
            </form>

            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse text-left">
                    <thead class="bg-gray-900 text-gray-400 uppercase text-xs border-b border-gray-700">
                        <tr>
                            <th class="p-3">Matricule</th>
                            <th class="p-3">Nom / Service</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="profiles-table-body" class="text-gray-300">
                        <tr>
                            <td colspan="3" class="p-6 text-center text-gray-500">
                                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Chargement...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal Création Auth User -->
    <div id="add-user-modal" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center hidden">
        <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-700">
                <h3 class="text-base font-bold text-white"><i class="fa-solid fa-user-plus mr-1 text-emerald-400"></i> Créer un utilisateur (auth.users)</h3>
                <button onclick="closeAddModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="add-user-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Email</label>
                    <input type="email" id="new-email" required placeholder="user@example.com" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Mot de passe</label>
                    <input type="password" id="new-password" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Nom Complet</label>
                    <input type="text" id="new-nom" placeholder="Nom & Prénom" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeAddModal()" class="bg-gray-700 hover:bg-gray-600 text-gray-300 px-4 py-2 rounded text-xs font-semibold transition">Annuler</button>
                    <button type="submit" id="btn-create-auth" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded text-xs font-bold transition shadow">Créer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script type="module">
        import supabase, { getUser } from "./assets/js/core/supabase.js";

        const emailSpan = document.getElementById("user-email");
        const userProfileForm = document.getElementById("user-profile-form");
        const addUserForm = document.getElementById("add-user-form");
        const authTableBody = document.getElementById("auth-users-table-body");
        const profilesTableBody = document.getElementById("profiles-table-body");
        
        const profileIdInput = document.getElementById("profile-id");
        const nomCompletInput = document.getElementById("nom-complet");
        const matriculeInput = document.getElementById("matricule");
        const serviceInput = document.getElementById("service");
        const posteInput = document.getElementById("poste");
        const roleIdInput = document.getElementById("role-id");

        document.addEventListener("DOMContentLoaded", async () => {
            const user = await getUser();
            if (user) {
                emailSpan.textContent = user.email || "Admin";
            }
            loadAllData();
        });

        async function loadAllData() {
            loadAuthUsers();
            loadProfiles();
        }

        // Chargement Jihat auth.users (B t-fɛil dyal view wla RPC awla RLS ila kant m-disponible, wla a-n-st3mlo user_profiles ila kan l-accès m-limité)
        async function loadAuthUsers() {
            try {
                // Supabase Client 3adi ma kay-khellikch t-chof auth.users m-bashra ila masi b Admin API,
                // Walakin n-qdro n-jibohom mn user_profiles b tariqa d auth info, awla n-st3mlo view.
                //hna a-n-jibohom mn user_profiles li fihom l-emails w les ID dyal auth.users:
                const { data, error } = await supabase
                    .from("user_profiles")
                    .select("id, email, created_at")
                    .order("created_at", { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    authTableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500 text-xs">Aucun compte auth trouvé.</td></tr>`;
                    return;
                }

                authTableBody.innerHTML = data.map(u => `
                    <tr class="border-b border-gray-700 hover:bg-gray-750 transition">
                        <td class="p-3 text-emerald-300 font-medium text-xs">
                            ${u.email || 'N/A'}
                            <br><span class="text-[10px] text-gray-500 font-mono">ID: ${u.id.substring(0,8)}...</span>
                        </td>
                        <td class="p-3 text-xs text-gray-300">Email Provider</td>
                        <td class="p-3 text-xs text-gray-400">${new Date(u.created_at).toLocaleDateString()}</td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error("Erreur auth users:", err);
                authTableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-red-400 text-xs">Erreur de chargement.</td></tr>`;
            }
        }

        // Chargement Jihat user_profiles
        async function loadProfiles() {
            try {
                const { data, error } = await supabase
                    .from("user_profiles")
                    .select("*")
                    .order("created_at", { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    profilesTableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500 text-xs">Aucun profil.</td></tr>`;
                    return;
                }

                profilesTableBody.innerHTML = data.map(p => `
                    <tr class="border-b border-gray-700 hover:bg-gray-750 transition">
                        <td class="p-3 font-semibold text-indigo-300 text-xs">${p.matricule || '-'}</td>
                        <td class="p-3 text-xs text-white">
                            <span class="font-bold">${p.nom_complet || 'Sans nom'}</span>
                            <br><span class="text-gray-400">${p.service || '-'} (${p.poste || '-'})</span>
                        </td>
                        <td class="p-3 text-center">
                            <button type="button" onclick="window.editProfile('${p.id}', '${escapeHtml(p.nom_complet || '')}', '${escapeHtml(p.matricule || '')}', '${escapeHtml(p.service || '')}', '${escapeHtml(p.poste || '')}', '${p.role_id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded text-[11px] transition shadow">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error("Erreur profiles:", err);
                profilesTableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-red-400 text-xs">Erreur chargement.</td></tr>`;
            }
        }

        // Création f auth.users
        addUserForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("new-email").value.trim();
            const password = document.getElementById("new-password").value.trim();
            const nom_complet = document.getElementById("new-nom").value.trim();

            try {
                const { data, error } = await supabase.auth.signUp({ 
                    email, 
                    password,
                    options: {
                        data: { nom_complet: nom_complet || email }
                    }
                });
                if (error) throw error;

                alert("Utilisateur créé avec succès dans auth.users !");
                closeAddModal();
                addUserForm.reset();
                
                setTimeout(loadAllData, 1000);

            } catch (err) {
                alert("Erreur création auth: " + err.message);
            }
        });

        // Update user_profiles
        userProfileForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = profileIdInput.value;

            if (!id) {
                alert("Erreur: Veuillez sélectionner un profil depuis le tableau à droite.");
                return;
            }

            const payload = {
                nom_complet: nomCompletInput.value.trim(),
                matricule: matriculeInput.value.trim() || null,
                service: serviceInput.value.trim() || null,
                poste: posteInput.value.trim() || null,
                role_id: parseInt(roleIdInput.value) || 1,
                updated_at: new Date().toISOString()
            };

            try {
                const { error } = await supabase.from("user_profiles").update(payload).eq("id", id);
                if (error) throw error;

                alert("Profil mis à jour avec succès !");
                window.resetForm();
                loadProfiles();

            } catch (err) {
                alert("Erreur mise à jour: " + err.message);
            }
        });

        window.openAddModal = function() {
            document.getElementById("add-user-modal").classList.remove("hidden");
        }

        window.closeAddModal = function() {
            document.getElementById("add-user-modal").classList.add("hidden");
        }

        window.editProfile = function(id, nom, matricule, service, poste, roleId) {
            profileIdInput.value = id;
            nomCompletInput.value = nom;
            matriculeInput.value = matricule;
            serviceInput.value = service;
            posteInput.value = poste;
            roleIdInput.value = roleId;
        };

        window.resetForm = function() {
            userProfileForm.reset();
            profileIdInput.value = "";
            roleIdInput.value = "1";
        };

        function escapeHtml(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
