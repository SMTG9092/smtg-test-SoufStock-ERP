<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock ERP - Gestion des Profils Utilisateurs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .custom-card {
            background-color: #1f2937;
            border: 1px solid #374151;
            transition: all 0.3s ease;
        }
        .custom-card:hover {
            border-color: #6366f1;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

    <!-- Header -->
    <header class="flex justify-between items-center bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-md mb-6">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-gray-100">
                <i class="fa-solid fa-id-card mr-2 text-indigo-400"></i> SoufStock ERP - Gestion des Profils (user_profiles)
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition">
                <i class="fa-solid fa-house mr-1"></i> Dashboard
            </a>
            <span class="font-semibold text-gray-300 text-sm bg-gray-900 px-3 py-1.5 rounded border border-gray-700">
                <i class="fa-solid fa-user mr-1 text-indigo-400"></i> <span id="user-email">Chargement...</span>
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Formulaire de Saisie / Modification du Profil -->
        <div class="custom-card p-5 rounded-lg shadow h-fit">
            <h2 id="form-title" class="text-base font-bold text-indigo-300 mb-4 pb-2 border-b border-gray-700">
                <i class="fa-solid fa-user-pen mr-1"></i> Attribuer / Modifier le Profil
            </h2>
            
            <form id="user-profile-form" class="space-y-4">
                
                <!-- Ikhtiyar Auth User -->
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Sélectionner un Compte Auth</label>
                    <select id="auth-user-select" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <option value="">-- Choisir un utilisateur auth --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Nom Complet</label>
                    <input type="text" id="nom-complet" required placeholder="Nom & Prénom" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Matricule</label>
                    <input type="text" id="matricule" placeholder="Ex: 001" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Service</label>
                    <input type="text" id="service" placeholder="Ex: Logistique" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Poste</label>
                    <input type="text" id="poste" placeholder="Ex: Gestionnaire" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Role ID</label>
                    <input type="number" id="role-id" value="1" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="btn-save" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded text-sm transition shadow">
                        Enregistrer le profil
                    </button>
                    <button type="button" onclick="resetForm()" class="bg-gray-700 hover:bg-gray-600 text-gray-300 px-4 py-2 rounded text-sm font-semibold transition">
                        Annuler
                    </button>
                </div>
            </form>
        </div>

        <!-- Tableau Liste des Profils Existants -->
        <div class="lg:col-span-2 custom-card p-5 rounded-lg shadow overflow-hidden">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-700">
                <h2 class="text-base font-bold text-indigo-300">
                    <i class="fa-solid fa-list mr-1"></i> Liste des Profils Enregistrés
                </h2>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse text-left">
                    <thead class="bg-gray-900 text-gray-400 uppercase text-xs border-b border-gray-700">
                        <tr>
                            <th class="p-3">Matricule</th>
                            <th class="p-3">Nom & Email</th>
                            <th class="p-3">Service / Poste</th>
                            <th class="p-3">Rôle ID</th>
                            <th class="p-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="profiles-table-body" class="text-gray-300">
                        <tr>
                            <td colspan="5" class="p-6 text-center text-gray-500">
                                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Chargement...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Script JavaScript -->
    <script type="module">
        import supabase, { getUser } from "./assets/js/core/supabase.js";

        const emailSpan = document.getElementById("user-email");
        const userProfileForm = document.getElementById("user-profile-form");
        const authUserSelect = document.getElementById("auth-user-select");
        const profilesTableBody = document.getElementById("profiles-table-body");
        
        const nomCompletInput = document.getElementById("nom-complet");
        const matriculeInput = document.getElementById("matricule");
        const serviceInput = document.getElementById("service");
        const posteInput = document.getElementById("poste");
        const roleIdInput = document.getElementById("role-id");

        document.addEventListener("DOMContentLoaded", async () => {
            const user = await getUser();
            if (user) {
                emailSpan.textContent = user.email || "Admin";
            }
            loadAuthUsersDropdown();
            loadProfiles();
        });

        // 1. Jib les utilisateurs mn user_profiles (li 3ndhom l-id w email d auth) bash n-khterhom f select
        async function loadAuthUsersDropdown() {
            try {
                const { data, error } = await supabase
                    .from("user_profiles")
                    .select("id, email, nom_complet")
                    .order("created_at", { ascending: false });

                if (error) throw error;

                authUserSelect.innerHTML = `<option value="">-- Choisir un utilisateur auth --</option>` + 
                    data.map(u => `<option value="${u.id}">${u.email} (${u.nom_complet || 'Sans nom'})</option>`).join('');

            } catch (err) {
                console.error("Erreur chargement select auth:", err);
            }
        }

        // 2. Chargement dyal l-tableau d profiles
        async function loadProfiles() {
            try {
                const { data, error } = await supabase
                    .from("user_profiles")
                    .select("*")
                    .order("created_at", { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    profilesTableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">Aucun profil trouvé.</td></tr>`;
                    return;
                }

                profilesTableBody.innerHTML = data.map(p => `
                    <tr class="border-b border-gray-700 hover:bg-gray-750 transition">
                        <td class="p-3 font-semibold text-indigo-300">${p.matricule || '-'}</td>
                        <td class="p-3 text-white font-bold">
                            ${p.nom_complet || 'Non défini'} 
                            <br><span class="text-xs text-gray-400 font-normal">${p.email || ''}</span>
                        </td>
                        <td class="p-3 text-gray-300">
                            ${p.service || '-'} 
                            <br><span class="text-xs text-indigo-400">${p.poste || ''}</span>
                        </td>
                        <td class="p-3">
                            <span class="bg-gray-900 border border-gray-700 px-2.5 py-1 rounded text-xs text-indigo-300 font-semibold">
                                Role ID: ${p.role_id}
                            </span>
                        </td>
                        <td class="p-3 text-center">
                            <button type="button" onclick="window.editProfile('${p.id}', '${escapeHtml(p.nom_complet || '')}', '${escapeHtml(p.matricule || '')}', '${escapeHtml(p.service || '')}', '${escapeHtml(p.poste || '')}', '${p.role_id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs transition shadow">
                                <i class="fa-solid fa-pen mr-1"></i> Modifier
                            </button>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error("Erreur chargement profiles:", err);
                profilesTableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-400">Erreur lors du chargement.</td></tr>`;
            }
        }

        // 3. Enregistrement / Update f user_profiles 3la ḥsab l-ID l-mokhtar
        userProfileForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const selectedId = authUserSelect.value;

            if (!selectedId) {
                alert("Veuillez sélectionner un utilisateur auth depuis la liste déroulante.");
                return;
            }

            const payload = {
                nom_complet: nomCompletInput.value.trim(),
                matricule: matriculeInput.value.trim() || null,
                service: serviceInput.value.trim() || null,
                poste: posteInput.value.trim() || null,
                role_id: parseInt(roleIdInput.value) || 1,
                updated_at: new Date().toISOString()
            };

            try {
                // Upsert awla Update b l-id dyal l-user li t-khtar
                const { error } = await supabase.from("user_profiles").update(payload).eq("id", selectedId);
                if (error) throw error;

                alert("Profil enregistré avec succès !");
                resetForm();
                loadProfiles();

            } catch (err) {
                alert("Erreur lors de l'enregistrement: " + err.message);
            }
        });

        window.editProfile = function(id, nom, matricule, service, poste, roleId) {
            authUserSelect.value = id;
            nomCompletInput.value = nom;
            matriculeInput.value = matricule;
            serviceInput.value = service;
            posteInput.value = poste;
            roleIdInput.value = roleId;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = function() {
            userProfileForm.reset();
            authUserSelect.value = "";
            roleIdInput.value = "1";
        };

        function escapeHtml(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
