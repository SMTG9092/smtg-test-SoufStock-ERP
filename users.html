<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock ERP - Gestion des Utilisateurs</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .custom-card {
            background-color: #1f2937;
            border: 1px solid #374151;
            transition: all 0.3s ease;
        }
        .custom-card:hover {
            border-color: #6366f1;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

    <!-- Header -->
    <header class="flex justify-between items-center bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-md mb-6">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-gray-100">
                <i class="fa-solid fa-users mr-2 text-indigo-400"></i> SoufStock ERP - Gestion des Utilisateurs
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition">
                <i class="fa-solid fa-house mr-1"></i> Dashboard
            </a>
            <span class="font-semibold text-gray-300 text-sm bg-gray-900 px-3 py-1.5 rounded border border-gray-700">
                <i class="fa-solid fa-user mr-1 text-indigo-400"></i> <span id="user-email">Chargement...</span>
            </span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Formulaire de Gestion Profile -->
        <div class="custom-card p-5 rounded-lg shadow h-fit">
            <h2 id="form-title" class="text-base font-bold text-indigo-300 mb-4 pb-2 border-b border-gray-700">
                <i class="fa-solid fa-user-pen mr-1"></i> Modifier le Profil Utilisateur
            </h2>
            
            <form id="user-profile-form" class="space-y-4">
                <input type="hidden" id="profile-id">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Nom Complet</label>
                    <input type="text" id="nom-complet" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Email</label>
                    <input type="email" id="email" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-gray-400 focus:outline-none" readonly>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Matricule</label>
                    <input type="text" id="matricule" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Service</label>
                    <input type="text" id="service" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Poste</label>
                    <input type="text" id="poste" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Role ID</label>
                    <input type="number" id="role-id" value="1" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="btn-save" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded text-sm transition shadow">
                        Mettre à jour
                    </button>
                    <button type="button" id="btn-cancel" onclick="resetForm()" class="bg-gray-700 hover:bg-gray-600 text-gray-300 px-4 py-2 rounded text-sm font-semibold transition">
                        Annuler
                    </button>
                </div>
            </form>
        </div>

        <!-- Tableau Liste des Profils -->
        <div class="lg:col-span-2 custom-card p-5 rounded-lg shadow overflow-hidden">
            <h2 class="text-base font-bold text-indigo-300 mb-4 pb-2 border-b border-gray-700">
                <i class="fa-solid fa-list mr-1"></i> Liste des Profils (user_profiles)
            </h2>

            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse text-left">
                    <thead class="bg-gray-900 text-gray-400 uppercase text-xs border-b border-gray-700">
                        <tr>
                            <th class="p-3">Matricule</th>
                            <th class="p-3">Nom Complet</th>
                            <th class="p-3">Service / Poste</th>
                            <th class="p-3">Rôle ID</th>
                            <th class="p-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="profiles-table-body" class="text-gray-300">
                        <tr>
                            <td colspan="5" class="p-6 text-center text-gray-500">
                                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Chargement...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Script JavaScript -->
    <script type="module">
        import supabase, { getUser } from "./assets/js/core/supabase.js";

        const emailSpan = document.getElementById("user-email");
        const userProfileForm = document.getElementById("user-profile-form");
        const profilesTableBody = document.getElementById("profiles-table-body");
        
        const profileIdInput = document.getElementById("profile-id");
        const nomCompletInput = document.getElementById("nom-complet");
        const emailInput = document.getElementById("email");
        const matriculeInput = document.getElementById("matricule");
        const serviceInput = document.getElementById("service");
        const posteInput = document.getElementById("poste");
        const roleIdInput = document.getElementById("role-id");

        document.addEventListener("DOMContentLoaded", async () => {
            const user = await getUser();
            if (user) {
                emailSpan.textContent = user.email || "Admin";
            }
            loadProfiles();
        });

        async function loadProfiles() {
            try {
                const { data, error } = await supabase
                    .from("user_profiles")
                    .select("*")
                    .order("created_at", { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    profilesTableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">Aucun profil trouvé dans user_profiles. (Ajoutez l'utilisateur dans auth.users d'abord).</td></tr>`;
                    return;
                }

                profilesTableBody.innerHTML = data.map(p => `
                    <tr class="border-b border-gray-700 hover:bg-gray-750 transition">
                        <td class="p-3 font-semibold text-indigo-300">${p.matricule || '-'}</td>
                        <td class="p-3 text-white font-bold">
                            ${p.nom_complet || '-'} 
                            <br><span class="text-xs text-gray-400 font-normal">${p.email || ''}</span>
                        </td>
                        <td class="p-3 text-gray-300">
                            ${p.service || '-'} 
                            <br><span class="text-xs text-indigo-400">${p.poste || ''}</span>
                        </td>
                        <td class="p-3">
                            <span class="bg-gray-900 border border-gray-700 px-2.5 py-1 rounded text-xs text-indigo-300 font-semibold">
                                Role ID: ${p.role_id}
                            </span>
                        </td>
                        <td class="p-3 text-center">
                            <button type="button" onclick="window.editProfile('${p.id}', '${escapeHtml(p.nom_complet || '')}', '${escapeHtml(p.email || '')}', '${escapeHtml(p.matricule || '')}', '${escapeHtml(p.service || '')}', '${escapeHtml(p.poste || '')}', '${p.role_id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs transition shadow">
                                <i class="fa-solid fa-pen mr-1"></i> Modifier
                            </button>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error("Erreur chargement profiles:", err.message);
                profilesTableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-400">Erreur lors du chargement des données.</td></tr>`;
            }
        }

        if (userProfileForm) {
            userProfileForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const id = profileIdInput.value;

                if (!id) {
                    alert("Erreur: Veuillez sélectionner un profil à modifier depuis le tableau.");
                    return;
                }

                const payload = {
                    nom_complet: nomCompletInput.value.trim(),
                    matricule: matriculeInput.value.trim() || null,
                    service: serviceInput.value.trim() || null,
                    poste: posteInput.value.trim() || null,
                    role_id: parseInt(roleIdInput.value) || 1,
                    updated_at: new Date().toISOString()
                };

                try {
                    const { error } = await supabase
                        .from("user_profiles")
                        .update(payload)
                        .eq("id", id);

                    if (error) throw error;

                    alert("Profil mis à jour avec succès !");
                    window.resetForm();
                    loadProfiles();

                } catch (err) {
                    alert("Erreur lors de la mise à jour: " + err.message);
                }
            });
        }

        window.editProfile = function(id, nom, email, matricule, service, poste, roleId) {
            profileIdInput.value = id;
            nomCompletInput.value = nom;
            emailInput.value = email;
            matriculeInput.value = matricule;
            serviceInput.value = service;
            posteInput.value = poste;
            roleIdInput.value = roleId;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = function() {
            userProfileForm.reset();
            profileIdInput.value = "";
            emailInput.value = "";
            roleIdInput.value = "1";
        };

        function escapeHtml(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
