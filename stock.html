<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock ERP - Gestion des Stocks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .custom-card {
            background-color: #1f2937;
            border: 1px solid #374151;
            transition: all 0.3s ease;
        }
        .custom-card:hover {
            border-color: #6366f1;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

    <!-- Header -->
    <header class="flex justify-between items-center bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-md mb-6">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-gray-100">
                <i class="fa-solid fa-boxes-stacked mr-2 text-indigo-400"></i> SoufStock ERP - État du Stock Disponible
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition">
                <i class="fa-solid fa-house mr-1"></i> Dashboard
            </a>
            <span class="font-semibold text-gray-300 text-sm bg-gray-900 px-3 py-1.5 rounded border border-gray-700">
                <i class="fa-solid fa-user mr-1 text-indigo-400"></i> <span id="user-email">Chargement...</span>
            </span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full">
        
        <!-- Tableau Liste des Stocks (View: v_stock_disponible) -->
        <div class="custom-card p-5 rounded-lg shadow overflow-hidden">
            <div class="flex flex-col md:flex-row justify-between items-center mb-4 pb-3 border-b border-gray-700 gap-3">
                <h2 class="text-base font-bold text-indigo-300">
                    <i class="fa-solid fa-list mr-1"></i> Vue Globale du Stock (v_stock_disponible)
                </h2>
                <div class="flex gap-2 w-full md:w-auto">
                    <input type="text" id="search-stock" placeholder="Filtrer par article, magasin..." class="bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500 w-full md:w-64">
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse text-left">
                    <thead class="bg-gray-900 text-gray-400 uppercase text-xs border-b border-gray-700">
                        <tr>
                            <th class="p-3">Article</th>
                            <th class="p-3">Désignation</th>
                            <th class="p-3">Lot</th>
                            <th class="p-3">Magasin / Emplacement</th>
                            <th class="p-3 text-center">Stock Total</th>
                            <th class="p-3 text-center">Réservé</th>
                            <th class="p-3 text-center">Disponible</th>
                            <th class="p-3">Statut</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="text-gray-300">
                        <tr>
                            <td colspan="8" class="p-6 text-center text-gray-500">
                                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Chargement des données du stock...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Script JavaScript -->
    <script type="module">
        import supabase, { getUser } from "./assets/js/core/supabase.js";

        const emailSpan = document.getElementById("user-email");
        const stockTableBody = document.getElementById("stock-table-body");
        const searchInput = document.getElementById("search-stock");

        let allStockData = [];

        document.addEventListener("DOMContentLoaded", async () => {
            const user = await getUser();
            if (user) {
                emailSpan.textContent = user.email || "Admin";
            }
            loadStockView();
        });

        async function loadStockView() {
            try {
                // Kan-jibohom mn la vue v_stock_disponible
                const { data, error } = await supabase
                    .from("v_stock_disponible")
                    .select("*");

                if (error) throw error;

                allStockData = data || [];
                renderTable(allStockData);

            } catch (err) {
                console.error("Erreur chargement view stock:", err.message);
                stockTableBody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-red-400">Erreur lors du chargement des données.</td></tr>`;
            }
        }

        function renderTable(data) {
            if (!data || data.length === 0) {
                stockTableBody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-gray-500">Aucun article trouvé dans le stock.</td></tr>`;
                return;
            }

            stockTableBody.innerHTML = data.map(item => `
                <tr class="border-b border-gray-700 hover:bg-gray-750 transition text-xs">
                    <td class="p-3 font-bold text-indigo-300">${item.article || '-'}</td>
                    <td class="p-3 text-white">${item.designation_article || '-'}</td>
                    <td class="p-3 font-mono text-gray-400">${item.lot || '-'}</td>
                    <td class="p-3 text-gray-300">
                        <span class="font-semibold text-gray-200">${item.magasin || '-'}</span>
                        <br><span class="text-[11px] text-gray-400">${item.emplacement || ''}</span>
                    </td>
                    <td class="p-3 text-center font-bold text-gray-200">
                        ${item.stock_total} <span class="text-[10px] text-gray-400 font-normal">${item.unite || ''}</span>
                    </td>
                    <td class="p-3 text-center text-orange-400 font-semibold">
                        ${item.stock_reserve || 0}
                    </td>
                    <td class="p-3 text-center font-bold text-emerald-400">
                        ${item.stock_disponible}
                    </td>
                    <td class="p-3">
                        <span class="bg-gray-900 border border-gray-700 px-2.5 py-1 rounded text-[10px] text-gray-300 font-semibold">
                            ${item.statut || 'N/A'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        // Filtre dynamique f recherche
        searchInput.addEventListener("input", (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allStockData.filter(item => 
                (item.article && item.article.toLowerCase().includes(query)) ||
                (item.designation_article && item.designation_article.toLowerCase().includes(query)) ||
                (item.magasin && item.magasin.toLowerCase().includes(query)) ||
                (item.lot && item.lot.toLowerCase().includes(query))
            );
            renderTable(filtered);
        });
    </script>
</body>
</html>
