<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock ERP - Gestion des Stocks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .custom-card {
            background-color: #1f2937;
            border: 1px solid #374151;
            transition: all 0.3s ease;
        }
        .custom-card:hover {
            border-color: #6366f1;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

    <!-- Header -->
    <header class="flex justify-between items-center bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-md mb-6">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-gray-100">
                <i class="fa-solid fa-boxes-stacked mr-2 text-indigo-400"></i> SoufStock ERP - Gestion des Stocks
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition">
                <i class="fa-solid fa-house mr-1"></i> Dashboard
            </a>
            <span class="font-semibold text-gray-300 text-sm bg-gray-900 px-3 py-1.5 rounded border border-gray-700">
                <i class="fa-solid fa-user mr-1 text-indigo-400"></i> <span id="user-email">Chargement...</span>
            </span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Formulaire d'Ajout / Modification Article -->
        <div class="custom-card p-5 rounded-lg shadow h-fit">
            <h2 id="form-title" class="text-base font-bold text-indigo-300 mb-4 pb-2 border-b border-gray-700">
                <i class="fa-solid fa-circle-plus mr-1"></i> Ajouter un Article
            </h2>
            
            <form id="stock-form" class="space-y-4">
                <input type="hidden" id="article-id">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Code Article / Référence</label>
                    <input type="text" id="code-article" required placeholder="Ex: ART-001" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Désignation</label>
                    <input type="text" id="designation" required placeholder="Nom de l'article" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Quantité</label>
                        <input type="number" id="quantite" value="0" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Unité</label>
                        <input type="text" id="unite" placeholder="Pcs, Kg..." class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Emplacement / Dépôt</label>
                    <input type="text" id="emplacement" placeholder="Ex: Zone A - Rayon 2" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="btn-save" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded text-sm transition shadow">
                        Enregistrer
                    </button>
                    <button type="button" onclick="resetForm()" class="bg-gray-700 hover:bg-gray-600 text-gray-300 px-4 py-2 rounded text-sm font-semibold transition">
                        Annuler
                    </button>
                </div>
            </form>
        </div>

        <!-- Tableau Liste des Stocks -->
        <div class="lg:col-span-2 custom-card p-5 rounded-lg shadow overflow-hidden">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-700">
                <h2 class="text-base font-bold text-indigo-300">
                    <i class="fa-solid fa-list mr-1"></i> État du Stock Actuel
                </h2>
                <div class="flex gap-2">
                    <input type="text" id="search-stock" placeholder="Rechercher..." class="bg-gray-900 border border-gray-700 rounded px-3 py-1 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse text-left">
                    <thead class="bg-gray-900 text-gray-400 uppercase text-xs border-b border-gray-700">
                        <tr>
                            <th class="p-3">Code</th>
                            <th class="p-3">Désignation</th>
                            <th class="p-3">Quantité</th>
                            <th class="p-3">Emplacement</th>
                            <th class="p-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="text-gray-300">
                        <tr>
                            <td colspan="5" class="p-6 text-center text-gray-500">
                                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Chargement des stocks...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Script JavaScript -->
    <script type="module">
        import supabase, { getUser } from "./assets/js/core/supabase.js";

        const emailSpan = document.getElementById("user-email");
        const stockForm = document.getElementById("stock-form");
        const stockTableBody = document.getElementById("stock-table-body");
        
        const articleIdInput = document.getElementById("article-id");
        const codeArticleInput = document.getElementById("code-article");
        const designationInput = document.getElementById("designation");
        const quantiteInput = document.getElementById("quantite");
        const uniteInput = document.getElementById("unite");
        const emplacementInput = document.getElementById("emplacement");

        document.addEventListener("DOMContentLoaded", async () => {
            const user = await getUser();
            if (user) {
                emailSpan.textContent = user.email || "Admin";
            }
            loadStock();
        });

        async function loadStock() {
            try {
                // Badel "stocks" b esm table dyalk f database ila kan m-baddel
                const { data, error } = await supabase
                    .from("stocks")
                    .select("*")
                    .order("created_at", { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    stockTableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">Aucun article trouvé dans le stock.</td></tr>`;
                    return;
                }

                stockTableBody.innerHTML = data.map(item => `
                    <tr class="border-b border-gray-700 hover:bg-gray-750 transition">
                        <td class="p-3 font-semibold text-indigo-300">${item.code_article || '-'}</td>
                        <td class="p-3 text-white font-bold">${item.designation || '-'}</td>
                        <td class="p-3">
                            <span class="bg-gray-900 border border-gray-700 px-2.5 py-1 rounded text-xs text-emerald-400 font-bold">
                                ${item.quantite} ${item.unite || ''}
                            </span>
                        </td>
                        <td class="p-3 text-gray-300 text-xs">${item.emplacement || '-'}</td>
                        <td class="p-3 text-center">
                            <button type="button" onclick="window.editArticle('${item.id}', '${escapeHtml(item.code_article || '')}', '${escapeHtml(item.designation || '')}', '${item.quantite}', '${escapeHtml(item.unite || '')}', '${escapeHtml(item.emplacement || '')}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded text-xs transition shadow">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error("Erreur chargement stock:", err.message);
                stockTableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-400">Erreur lors du chargement des données.</td></tr>`;
            }
        }

        stockForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = articleIdInput.value;

            const payload = {
                code_article: codeArticleInput.value.trim(),
                designation: designationInput.value.trim(),
                quantite: parseFloat(quantiteInput.value) || 0,
                unite: uniteInput.value.trim() || null,
                emplacement: emplacementInput.value.trim() || null,
                updated_at: new Date().toISOString()
            };

            try {
                if (id) {
                    // Update
                    const { error } = await supabase.from("stocks").update(payload).eq("id", id);
                    if (error) throw error;
                    alert("Article mis à jour avec succès !");
                } else {
                    // Insert
                    const { error } = await supabase.from("stocks").insert([payload]);
                    if (error) throw error;
                    alert("Article ajouté avec succès !");
                }

                resetForm();
                loadStock();

            } catch (err) {
                alert("Erreur: " + err.message);
            }
        });

        window.editArticle = function(id, code, designation, quantite, unite, emplacement) {
            articleIdInput.value = id;
            codeArticleInput.value = code;
            designationInput.value = designation;
            quantiteInput.value = quantite;
            uniteInput.value = unite;
            emplacementInput.value = emplacement;

            document.getElementById("form-title").innerHTML = `<i class="fa-solid fa-pen-to-square mr-1"></i> Modifier l'Article`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = function() {
            stockForm.reset();
            articleIdInput.value = "";
            document.getElementById("form-title").innerHTML = `<i class="fa-solid fa-circle-plus mr-1"></i> Ajouter un Article`;
        };

        function escapeHtml(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
