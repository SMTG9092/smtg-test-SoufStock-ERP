<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Stock - SoufStock Enterprise</title>
    
    <!-- CSS Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/output.css"> <!-- Awla l-css dyalk -->
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col p-4">
        <div class="flex items-center gap-3 px-2 mb-6">
            <i class="fas fa-snowflake text-emerald-500 text-2xl"></i>
            <span class="font-bold text-lg tracking-wide">SoufStock</span>
        </div>
        
        <!-- Navigation Container (Kay-t-généra dynamiquement b navigation.js) -->
        <nav id="sidebarNav" class="flex-1 overflow-y-auto">
            <!-- Les liens kaytsetaw hna otomatikan -->
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- HEADER -->
        <header class="h-16 border-b border-slate-800 bg-slate-900/50 backdrop-blur px-6 flex items-center justify-between">
            <div>
                <h1 id="pageTitle" class="text-lg font-bold">Gestion Stock</h1>
                <div id="breadcrumb" class="text-xs text-slate-400 flex items-center gap-1 mt-0.5">
                    <span>Accueil</span>
                    <span>/</span>
                    <strong>Gestion Stock</strong>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <span id="userName" class="text-sm font-medium">YAHYA SOUFIANE</span>
            </div>
        </header>

        <!-- PAGE BODY -->
        <main class="flex-1 p-6 overflow-y-auto">
            <div class="max-w-7xl mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-semibold">État Global du Stock</h2>
                    <button class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                        <i class="fas fa-plus"></i> Ajouter Article
                    </button>
                </div>

                <!-- Contenu dyal la page d stock -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <p class="text-slate-400 text-sm">Chargement des données du stock...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import Navigation from './assets/js/core/navigation.js';

        // Init Navigation w Vérification dyal Permissions Otomatikian
        document.addEventListener("DOMContentLoaded", async () => {
            await Navigation.init();
        });
    </script>
</body>
</html>
