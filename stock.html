<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Stock - SoufStock Enterprise</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#020617',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            400: '#94a3b8',
                            300: '#cbd5e1',
                            100: '#f1f5f9'
                        },
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                            400: '#34d399',
                            300: '#6ee7b7'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbars matching dashboard style */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        body { background-color: #020617; color: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex antialiased">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col p-4">
        <div class="flex items-center gap-3 px-2 mb-6">
            <i class="fas fa-snowflake text-emerald-500 text-2xl"></i>
            <span class="font-bold text-lg tracking-wide">SoufStock</span>
        </div>
        
        <!-- Navigation Container (Dynamic Sidebar) -->
        <nav id="sidebarNav" class="flex-1 overflow-y-auto">
            <!-- Kaytseta otomatikan mn navigation.js -->
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- HEADER -->
        <header class="h-16 border-b border-slate-800 bg-slate-900/50 backdrop-blur px-6 flex items-center justify-between">
            <div>
                <h1 id="pageTitle" class="text-lg font-bold">Gestion Stock</h1>
                <div id="breadcrumb" class="text-xs text-slate-400 flex items-center gap-1 mt-0.5">
                    <span>Accueil</span>
                    <span>/</span>
                    <strong>Gestion Stock</strong>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <span id="userName" class="text-sm font-medium">YAHYA SOUFIANE</span>
            </div>
        </header>

        <!-- PAGE BODY -->
        <main class="flex-1 p-6 overflow-y-auto">
            <div class="max-w-7xl mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-xl font-semibold">État Global du Stock</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Données en direct depuis la vue <span class="text-emerald-400">vw_stock</span></p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                            <input type="text" id="searchInput" placeholder="Rechercher article, désignation, lot..." 
                                class="bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 w-72 transition">
                        </div>
                    </div>
                </div>

                <!-- TABLE CONTAINER -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-800/40 text-slate-400 uppercase text-xs tracking-wider border-b border-slate-800">
                                    <th class="p-4">Article</th>
                                    <th class="p-4">Désignation</th>
                                    <th class="p-4">Lot</th>
                                    <th class="p-4">Magasin</th>
                                    <th class="p-4">Unité</th>
                                    <th class="p-4 text-right">Stock Disponible</th>
                                    <th class="p-4 text-right">Stock Réservé</th>
                                    <th class="p-4 text-center">Statut</th>
                                </tr>
                            </thead>
                            <tbody id="stockTableBody" class="divide-y divide-slate-800/50">
                                <tr>
                                    <td colspan="8" class="p-8 text-center text-slate-400">
                                        <i class="fas fa-spinner fa-spin mr-2 text-emerald-500"></i> Chargement des données du stock...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import Navigation from './assets/js/core/navigation.js';
        import supabase from './assets/js/core/supabase.js';

        document.addEventListener("DOMContentLoaded", async () => {
            // 1. Initialiser la navigation et la vérification des permissions (444.html)
            await Navigation.init();

            // 2. Charger les données depuis vw_stock
            await loadStockData();

            // 3. Activer la recherche dynamique
            const searchInput = document.getElementById("searchInput");
            if (searchInput) {
                searchInput.addEventListener("input", (e) => {
                    loadStockData(e.target.value);
                });
            }
        });

        async function loadStockData(search = "") {
            const tbody = document.getElementById("stockTableBody");
            
            try {
                let query = supabase
                    .from('vw_stock')
                    .select('*')
                    .limit(150);

                if (search.trim() !== "") {
                    query = query.or(`article.ilike.%${search}%,designation_article.ilike.%${search}%,lot.ilike.%${search}%`);
                }

                const { data, error } = await query;

                if (error) {
                    console.error("Erreur chargement stock:", error);
                    tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-red-400"><i class="fas fa-exclamation-triangle mr-2"></i> Erreur lors du chargement des données.</td></tr>`;
                    return;
                }

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-400"><i class="fas fa-folder-open mr-2"></i> Aucun article trouvé.</td></tr>`;
                    return;
                }

                let html = "";
                data.forEach(item => {
                    html += `
                        <tr class="hover:bg-slate-800/30 transition">
                            <td class="p-4 font-semibold text-emerald-400">${item.article || '-'}</td>
                            <td class="p-4 text-slate-200 font-medium">${item.designation_article || '-'}</td>
                            <td class="p-4 text-slate-400 font-mono text-xs">${item.lot || '-'}</td>
                            <td class="p-4 text-slate-300 font-medium">${item.magasin || '-'}</td>
                            <td class="p-4 text-slate-400 text-xs uppercase">${item.unite || '-'}</td>
                            <td class="p-4 text-right font-semibold text-emerald-300">${item.stock_disponible ?? 0}</td>
                            <td class="p-4 text-right font-medium text-amber-400">${item.stock_reserve ?? 0}</td>
                            <td class="p-4 text-center">
                                <span class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-800/80 text-slate-300 border border-slate-700/60 shadow-sm">
                                    ${item.statut || 'DISPONIBLE'}
                                </span>
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;

            } catch (err) {
                console.error("Erreur technique:", err);
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-red-400">Erreur de connexion au serveur.</td></tr>`;
            }
        }
    </script>
</body>
</html>
